# Postgres 16 for every module that runs on 16 in GCP. One database per module, created by
# lib/ensure-db.mjs. Data survives restarts in the named volume.
services:
  pg16:
    image: postgres:16
    container_name: agb-pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5416:5432"
    volumes:
      - agb-pg16-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agb-pg16-data:
